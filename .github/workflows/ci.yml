name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: propops
          POSTGRES_USER: propops
          POSTGRES_PASSWORD: propops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U propops -d propops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Migration smoke test
        run: |
          docker run --rm --network host             -e PGPASSWORD=propops             -v "$PWD:/repo:ro"             postgres:17-alpine             psql -h 127.0.0.1 -U propops -d propops -v ON_ERROR_STOP=1             -f /repo/apps/api/db/migrations/0001_identity_property_foundation.sql

          docker run --rm --network host             -e PGPASSWORD=propops             -v "$PWD:/repo:ro"             postgres:17-alpine             psql -h 127.0.0.1 -U propops -d propops -v ON_ERROR_STOP=1             -f /repo/apps/api/db/migrations/0001_identity_property_foundation.down.sql

          docker run --rm --network host             -e PGPASSWORD=propops             -v "$PWD:/repo:ro"             postgres:17-alpine             psql -h 127.0.0.1 -U propops -d propops -v ON_ERROR_STOP=1             -f /repo/apps/api/db/migrations/0001_identity_property_foundation.sql

      - name: Build
        run: pnpm build

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: propops
          POSTGRES_USER: propops
          POSTGRES_PASSWORD: propops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U propops -d propops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Docker Compose config
        run: docker compose -f infra/docker-compose.yml config >/dev/null

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Database setup command smoke test
        run: |
          docker run --rm --network host             -e PGPASSWORD=propops             postgres:17-alpine             psql -h 127.0.0.1 -U propops -d postgres -v ON_ERROR_STOP=1             -c "DROP DATABASE IF EXISTS propops_runtime WITH (FORCE);"             -c "CREATE DATABASE propops_runtime;"

          DATABASE_URL=postgresql://propops:propops@127.0.0.1:5432/propops_runtime             pnpm --filter @propops/api db:setup

          DATABASE_URL=postgresql://propops:propops@127.0.0.1:5432/propops_runtime             pnpm --filter @propops/api db:setup

      - name: Migration smoke test
        run: |
          run_psql() {
            docker run --rm --network host               -e PGPASSWORD=propops               -v "$PWD:/repo:ro"               postgres:17-alpine               psql -h 127.0.0.1 -U propops -d propops -v ON_ERROR_STOP=1 -f "$1"
          }

          for migration in             0001_identity_property_foundation             0002_leasing_contract_lifecycle             0003_cms_commercial_foundation             0004_automation_quota_foundation             0005_notification_jobs_foundation             0006_notification_provider_operations             0007_saas_subscription_billing             0008_saas_billing_provider_inbox             0009_brand_dashboard_defaults             0010_habi_brand_refresh             0011_system_worker_observability             0012_renter_billing_foundation             0013_renter_pricing_metering             0014_renter_payment_allocation             0015_renter_payment_provider_inbox             0016_public_invoice_vietqr             0017_auth_sessions_and_credentials             0018_notification_job_message_override             0019_renter_provider_transaction_identity
          do
            run_psql "/repo/apps/api/db/migrations/${migration}.sql"
          done

          for migration in             0019_renter_provider_transaction_identity             0018_notification_job_message_override             0017_auth_sessions_and_credentials             0016_public_invoice_vietqr             0015_renter_payment_provider_inbox             0014_renter_payment_allocation             0013_renter_pricing_metering             0012_renter_billing_foundation             0011_system_worker_observability             0010_habi_brand_refresh             0009_brand_dashboard_defaults             0008_saas_billing_provider_inbox             0007_saas_subscription_billing             0006_notification_provider_operations             0005_notification_jobs_foundation             0004_automation_quota_foundation             0003_cms_commercial_foundation             0002_leasing_contract_lifecycle             0001_identity_property_foundation
          do
            run_psql "/repo/apps/api/db/migrations/${migration}.down.sql"
          done

          for migration in             0001_identity_property_foundation             0002_leasing_contract_lifecycle             0003_cms_commercial_foundation             0004_automation_quota_foundation             0005_notification_jobs_foundation             0006_notification_provider_operations             0007_saas_subscription_billing             0008_saas_billing_provider_inbox             0009_brand_dashboard_defaults             0010_habi_brand_refresh             0011_system_worker_observability             0012_renter_billing_foundation             0013_renter_pricing_metering             0014_renter_payment_allocation             0015_renter_payment_provider_inbox             0016_public_invoice_vietqr             0017_auth_sessions_and_credentials             0018_notification_job_message_override             0019_renter_provider_transaction_identity
          do
            run_psql "/repo/apps/api/db/migrations/${migration}.sql"
          done

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://propops:propops@127.0.0.1:5432/propops
          DATABASE_POOL_MAX: 4
          AUTH_SESSION_TTL_DAYS: 30
        run: pnpm --filter @propops/api test:integration

      - name: Build
        run: pnpm build

name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: propops
          POSTGRES_USER: propops
          POSTGRES_PASSWORD: propops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U propops -d propops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Docker Compose config
        run: docker compose -f infra/docker-compose.yml config >/dev/null

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Database setup command smoke test
        run: |
          docker run --rm --network host             -e PGPASSWORD=propops             postgres:17-alpine             psql -h 127.0.0.1 -U propops -d postgres -v ON_ERROR_STOP=1             -c "DROP DATABASE IF EXISTS propops_runtime WITH (FORCE);"             -c "CREATE DATABASE propops_runtime;"

          DATABASE_URL=postgresql://propops:propops@127.0.0.1:5432/propops_runtime             pnpm --filter @propops/api db:setup

          DATABASE_URL=postgresql://propops:propops@127.0.0.1:5432/propops_runtime             pnpm --filter @propops/api db:setup

      - name: Migration smoke test
        run: |
          run_psql() {
            docker run --rm --network host \
              -e PGPASSWORD=propops \
              -v "$PWD:/repo:ro" \
              postgres:17-alpine \
              psql -h 127.0.0.1 -U propops -d propops -v ON_ERROR_STOP=1 -f "$1"
          }

          mapfile -t migrations < <(
            find apps/api/db/migrations -maxdepth 1 -type f \
              -name '[0-9][0-9][0-9][0-9]_*.sql' \
              ! -name '*.down.sql' \
              -printf '%f\n' | sort
          )

          if [ "${#migrations[@]}" -eq 0 ]; then
            echo "No migrations discovered" >&2
            exit 1
          fi

          for file in "${migrations[@]}"; do
            run_psql "/repo/apps/api/db/migrations/$file"
          done

          for ((index=${#migrations[@]}-1; index>=0; index--)); do
            file="${migrations[$index]}"
            down="${file%.sql}.down.sql"
            if [ ! -f "apps/api/db/migrations/$down" ]; then
              echo "Missing rollback migration: $down" >&2
              exit 1
            fi
            run_psql "/repo/apps/api/db/migrations/$down"
          done

          for file in "${migrations[@]}"; do
            run_psql "/repo/apps/api/db/migrations/$file"
          done

      - name: Integration tests
        env:
          DATABASE_URL: postgresql://propops:propops@127.0.0.1:5432/propops
          DATABASE_POOL_MAX: 4
          AUTH_SESSION_TTL_DAYS: 30
        run: pnpm --filter @propops/api test:integration

      - name: Build
        run: pnpm build

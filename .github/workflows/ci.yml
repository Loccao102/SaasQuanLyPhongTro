name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: propops
          POSTGRES_USER: propops
          POSTGRES_PASSWORD: propops
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U propops -d propops"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Docker Compose config
        run: docker compose -f infra/docker-compose.yml config >/dev/null

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Database setup command smoke test
        run: |
          docker run --rm --network host \
            -e PGPASSWORD=propops \
            postgres:17-alpine \
            psql -h 127.0.0.1 -U propops -d postgres -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE IF EXISTS propops_runtime WITH (FORCE);" \
            -c "CREATE DATABASE propops_runtime;"

          DATABASE_URL=postgresql://propops:propops@127.0.0.1:5432/propops_runtime \
            pnpm --filter @propops/api db:setup

          DATABASE_URL=postgresql://propops:propops@127.0.0.1:5432/propops_runtime \
            pnpm --filter @propops/api db:setup

      - name: Migration smoke test
        run: |
          run_psql() {
            docker run --rm --network host \
              -e PGPASSWORD=propops \
              -v "$PWD:/repo:ro" \
              postgres:17-alpine \
              psql -h 127.0.0.1 -U propops -d propops -v ON_ERROR_STOP=1 -f "$1"
          }

          run_psql /repo/apps/api/db/migrations/0001_identity_property_foundation.sql
          run_psql /repo/apps/api/db/migrations/0002_leasing_contract_lifecycle.sql
          run_psql /repo/apps/api/db/migrations/0003_cms_commercial_foundation.sql
          run_psql /repo/apps/api/db/migrations/0004_automation_quota_foundation.sql
          run_psql /repo/apps/api/db/migrations/0005_notification_jobs_foundation.sql
          run_psql /repo/apps/api/db/migrations/0006_notification_provider_operations.sql
          run_psql /repo/apps/api/db/migrations/0007_saas_subscription_billing.sql
          run_psql /repo/apps/api/db/migrations/0008_saas_billing_provider_inbox.sql
          run_psql /repo/apps/api/db/migrations/0009_brand_dashboard_defaults.sql
          run_psql /repo/apps/api/db/migrations/0010_habi_brand_refresh.sql
          run_psql /repo/apps/api/db/migrations/0011_system_worker_observability.sql

          run_psql /repo/apps/api/db/migrations/0011_system_worker_observability.down.sql
          run_psql /repo/apps/api/db/migrations/0010_habi_brand_refresh.down.sql
          run_psql /repo/apps/api/db/migrations/0009_brand_dashboard_defaults.down.sql
          run_psql /repo/apps/api/db/migrations/0008_saas_billing_provider_inbox.down.sql
          run_psql /repo/apps/api/db/migrations/0007_saas_subscription_billing.down.sql
          run_psql /repo/apps/api/db/migrations/0006_notification_provider_operations.down.sql
          run_psql /repo/apps/api/db/migrations/0005_notification_jobs_foundation.down.sql
          run_psql /repo/apps/api/db/migrations/0004_automation_quota_foundation.down.sql
          run_psql /repo/apps/api/db/migrations/0003_cms_commercial_foundation.down.sql
          run_psql /repo/apps/api/db/migrations/0002_leasing_contract_lifecycle.down.sql
          run_psql /repo/apps/api/db/migrations/0001_identity_property_foundation.down.sql

          run_psql /repo/apps/api/db/migrations/0001_identity_property_foundation.sql
          run_psql /repo/apps/api/db/migrations/0002_leasing_contract_lifecycle.sql
          run_psql /repo/apps/api/db/migrations/0003_cms_commercial_foundation.sql
          run_psql /repo/apps/api/db/migrations/0004_automation_quota_foundation.sql
          run_psql /repo/apps/api/db/migrations/0005_notification_jobs_foundation.sql
          run_psql /repo/apps/api/db/migrations/0006_notification_provider_operations.sql
          run_psql /repo/apps/api/db/migrations/0007_saas_subscription_billing.sql
          run_psql /repo/apps/api/db/migrations/0008_saas_billing_provider_inbox.sql
          run_psql /repo/apps/api/db/migrations/0009_brand_dashboard_defaults.sql
          run_psql /repo/apps/api/db/migrations/0010_habi_brand_refresh.sql
          run_psql /repo/apps/api/db/migrations/0011_system_worker_observability.sql

      - name: Leasing integration tests
        env:
          DATABASE_URL: postgresql://propops:propops@127.0.0.1:5432/propops
          DATABASE_POOL_MAX: 4
        run: pnpm --filter @propops/api test:integration

      - name: Build
        run: pnpm build

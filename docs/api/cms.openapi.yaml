openapi: 3.1.0
info:
  title: Prop-Ops CMS API
  version: 0.5.0
  description: Platform-operator API backed by SaaS-owned modules and PostgreSQL.
servers:
  - url: /api/cms
paths:
  /dashboard:
    get:
      summary: Get operational summary
      responses:
        "200": { description: OK }
        "401": { description: No active platform principal }
  /settings:
    get:
      summary: List system settings
      responses:
        "200": { description: OK }
  /settings/{key}:
    patch:
      summary: Versioned, audited system-setting update
      parameters:
        - { in: path, name: key, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, expectedVersion, reason]
              properties:
                value: {}
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 3 }
      responses:
        "200": { description: Updated or replayed idempotent response }
        "409": { description: Version conflict or reused idempotency key with different payload }
  /plans:
    get:
      summary: List current SaaS plan versions
      responses:
        "200": { description: OK }
  /plans/{code}:
    patch:
      summary: Create a new plan version and make it current
      parameters:
        - { in: path, name: code, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monthlyPriceVnd, roomLimit, staffLimit, automationQuota, expectedVersion, reason]
              properties:
                monthlyPriceVnd: { type: integer, minimum: 0 }
                roomLimit: { type: integer, minimum: 1 }
                staffLimit: { type: integer, minimum: 1 }
                automationQuota: { type: integer, minimum: 0 }
                expectedVersion: { type: integer, minimum: 1 }
                effectiveAt: { type: string, format: date-time }
                reason: { type: string, minLength: 3 }
      responses:
        "200": { description: New current plan version }
        "409": { description: Version conflict or idempotency conflict }
  /organizations:
    get:
      summary: Inspect organizations, subscriptions and current room/staff usage
      responses:
        "200": { description: OK }
  /organizations/{organizationId}/subscription:
    post:
      summary: Provision an organization subscription from the current plan version
      parameters:
        - { in: path, name: organizationId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planCode, status, reason]
              properties:
                planCode: { type: string }
                status: { type: string, enum: [TRIALING, ACTIVE] }
                trialEndsAt: { type: [string, "null"], format: date-time }
                reason: { type: string, minLength: 3 }
      responses:
        "200": { description: Provisioned subscription or idempotent replay }
        "404": { description: Organization or active plan not found }
        "409": { description: Subscription already exists or idempotency conflict }
  /organizations/{organizationId}/subscription/transition:
    post:
      summary: Transition organization subscription lifecycle state
      parameters:
        - { in: path, name: organizationId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, expectedVersion, reason]
              properties:
                to:
                  type: string
                  enum: [TRIALING, ACTIVE, PAST_DUE, GRACE_PERIOD, SUSPENDED, CANCELLED]
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 3 }
      responses:
        "200": { description: Transitioned subscription or idempotent replay }
        "400": { description: Invalid lifecycle transition }
        "404": { description: Subscription not found }
        "409": { description: Optimistic version or idempotency conflict }
  /organizations/{organizationId}/subscription/change-plan:
    post:
      summary: Change subscription to the current version of a target plan without payment side effects
      parameters:
        - { in: path, name: organizationId, required: true, schema: { type: string, format: uuid } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetPlanCode, expectedVersion, reason]
              properties:
                targetPlanCode: { type: string }
                expectedVersion: { type: integer, minimum: 1 }
                reason: { type: string, minLength: 3 }
      responses:
        "200": { description: Subscription plan snapshot changed or idempotent replay }
        "400": { description: Invalid/cancelled/no-op plan change }
        "404": { description: Subscription or target plan not found }
        "409": { description: Optimistic version or idempotency conflict }
  /entitlement-overrides:
    get:
      summary: List current non-revoked organization entitlement overrides
      responses:
        "200": { description: OK }
  /organizations/{organizationId}/entitlement-overrides/{key}:
    patch:
      summary: Set or supersede an organization entitlement override
      parameters:
        - { in: path, name: organizationId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: key, required: true, schema: { type: string, enum: [room_limit, staff_limit, automation_actions_monthly, advanced_reports, audit_log] } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, reason]
              properties:
                value: {}
                expiresAt: { type: [string, "null"], format: date-time }
                reason: { type: string, minLength: 3 }
      responses:
        "200": { description: Override set or idempotently replayed }
        "400": { description: Invalid key, value, expiry or reason }
        "409": { description: Reused idempotency key with different payload }
  /organizations/{organizationId}/entitlement-overrides/{key}/revoke:
    post:
      summary: Revoke an organization entitlement override
      parameters:
        - { in: path, name: organizationId, required: true, schema: { type: string, format: uuid } }
        - { in: path, name: key, required: true, schema: { type: string, enum: [room_limit, staff_limit, automation_actions_monthly, advanced_reports, audit_log] } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string, minLength: 8 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 3 }
      responses:
        "200": { description: Override revoked or idempotently replayed }
        "404": { description: No current override for that organization/key }
  /jobs:
    get:
      summary: Read job-integration status
      responses:
        "200": { description: Returns connected=false until durable jobs exist }
  /jobs/{jobId}/retry:
    post:
      summary: Retry a durable job
      responses:
        "501": { description: Not available until durable job persistence is connected }
  /logs:
    get:
      summary: Read observability-integration status
      responses:
        "200": { description: Returns connected=false until observability is connected }
  /audit:
    get:
      summary: List durable platform audit events
      responses:
        "200": { description: OK }

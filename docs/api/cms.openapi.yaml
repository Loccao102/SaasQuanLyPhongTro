openapi: 3.1.0
info:
  title: Prop-Ops CMS API
  version: 0.1.0
  description: Draft platform-operator contract. Business ownership remains in SaaS modules.
servers:
  - url: /api/cms
paths:
  /dashboard:
    get:
      summary: Get operational summary
      responses:
        "200": { description: OK }
  /settings:
    get:
      summary: List system settings
      responses:
        "200": { description: OK }
  /settings/{key}:
    patch:
      summary: Change a system setting
      parameters:
        - { in: path, name: key, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value, reason]
              properties:
                value: {}
                expectedVersion: { type: integer, minimum: 0 }
                reason: { type: string, minLength: 3 }
      responses:
        "200": { description: Updated }
        "409": { description: Version conflict or invalid change }
  /plans:
    get:
      summary: List SaaS plans
      responses:
        "200": { description: OK }
  /plans/{code}:
    patch:
      summary: Change plan configuration
      parameters:
        - { in: path, name: code, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "200": { description: Updated }
  /organizations:
    get:
      summary: Search organizations across the SaaS
      responses:
        "200": { description: OK }
  /organizations/{organizationId}:
    get:
      summary: Get subscription, usage and operational summary
      parameters:
        - { in: path, name: organizationId, required: true, schema: { type: string } }
      responses:
        "200": { description: OK }
  /jobs:
    get:
      summary: List operational jobs
      responses:
        "200": { description: OK }
  /jobs/{jobId}/retry:
    post:
      summary: Queue idempotent manual retry
      parameters:
        - { in: path, name: jobId, required: true, schema: { type: string } }
        - { in: header, name: Idempotency-Key, required: true, schema: { type: string } }
      responses:
        "202": { description: Retry queued }
        "409": { description: Job not retryable }
  /logs:
    get:
      summary: Query technical logs through observability integration
      responses:
        "200": { description: OK }
  /audit:
    get:
      summary: List platform audit events
      responses:
        "200": { description: OK }

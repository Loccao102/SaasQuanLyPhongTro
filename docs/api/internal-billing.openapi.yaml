openapi: 3.1.0
info:
  title: Prop-Ops Internal SaaS Billing Worker API
  version: 0.1.0
  description: Server-to-server endpoint for bounded SaaS subscription billing sweeps.
servers:
  - url: /api/internal/billing
security:
  - workerBearer: []
paths:
  /sweep:
    post:
      summary: Process a bounded batch of renewal/delinquency candidates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                  minimum: 1
                  maximum: 500
                  default: 100
      responses:
        "200":
          description: Per-organization billing processing results
        "400":
          description: Invalid batch limit
        "401":
          description: Invalid or missing internal service bearer token
components:
  securitySchemes:
    workerBearer:
      type: http
      scheme: bearer

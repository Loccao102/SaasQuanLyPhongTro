services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: propops
      POSTGRES_USER: propops
      POSTGRES_PASSWORD: propops
    ports: ["5432:5432"]
    volumes: [propops_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U propops -d propops"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [propops_redis:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  propops_postgres:
  propops_redis:

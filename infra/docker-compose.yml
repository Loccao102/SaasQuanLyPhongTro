name: habi

x-node-service: &node-service
  image: habi-dev:local
  build:
    context: ..
    dockerfile: infra/Dockerfile.dev

x-playwright-worker-service: &playwright-worker-service
  image: habi-playwright-worker:local
  build:
    context: ..
    dockerfile: infra/Dockerfile.playwright-worker
  ipc: host

x-worker-environment: &worker-environment
  NODE_ENV: development
  INTERNAL_API_BASE_URL: http://api:4000/api
  INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN:-replace-with-a-long-random-worker-token}
  WORKER_PROVIDER: ${WORKER_PROVIDER:-DEV_MANUAL_REVIEW}
  ZALO_SESSION_MASTER_KEY_BASE64: ${ZALO_SESSION_MASTER_KEY_BASE64:-}
  WORKER_POLL_INTERVAL_MS: ${WORKER_POLL_INTERVAL_MS:-1500}
  WORKER_HEARTBEAT_INTERVAL_MS: ${WORKER_HEARTBEAT_INTERVAL_MS:-15000}
  BILLING_SWEEP_INTERVAL_MS: ${BILLING_SWEEP_INTERVAL_MS:-60000}
  BILLING_SWEEP_LIMIT: ${BILLING_SWEEP_LIMIT:-100}
  BILLING_WEBHOOK_PROVIDER: ${BILLING_WEBHOOK_PROVIDER:-DEV_JSON_BANK}
  BILLING_WEBHOOK_POLL_INTERVAL_MS: ${BILLING_WEBHOOK_POLL_INTERVAL_MS:-1500}
  RENTER_PAYMENT_WEBHOOK_PROVIDER: ${RENTER_PAYMENT_WEBHOOK_PROVIDER:-DEV_JSON_BANK}
  RENTER_PAYMENT_WEBHOOK_POLL_INTERVAL_MS: ${RENTER_PAYMENT_WEBHOOK_POLL_INTERVAL_MS:-1500}
  SEPAY_RENTER_WEBHOOK_SECRET: ${SEPAY_RENTER_WEBHOOK_SECRET:-}
  SEPAY_RENTER_WEBHOOK_SECRET_PREVIOUS: ${SEPAY_RENTER_WEBHOOK_SECRET_PREVIOUS:-}
  SEPAY_RECONCILIATION_ENABLED: ${SEPAY_RECONCILIATION_ENABLED:-false}
  SEPAY_API_BASE_URL: ${SEPAY_API_BASE_URL:-https://userapi.sepay.vn/v2}
  SEPAY_API_TOKEN: ${SEPAY_API_TOKEN:-}
  SEPAY_RECONCILIATION_SCOPE_KEY: ${SEPAY_RECONCILIATION_SCOPE_KEY:-default}
  SEPAY_RECONCILIATION_INTERVAL_MS: ${SEPAY_RECONCILIATION_INTERVAL_MS:-900000}
  SEPAY_RECONCILIATION_INITIAL_LOOKBACK_HOURS: ${SEPAY_RECONCILIATION_INITIAL_LOOKBACK_HOURS:-24}
  DEV_BILLING_WEBHOOK_SECRET: ${DEV_BILLING_WEBHOOK_SECRET:-replace-with-at-least-16-random-characters}
  AUTH_PUBLIC_APP_URL: ${AUTH_PUBLIC_APP_URL:-http://localhost:3000}
  AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  AUTH_EMAIL_VERIFICATION_TTL_HOURS: ${AUTH_EMAIL_VERIFICATION_TTL_HOURS:-24}
  AUTH_PASSWORD_RESET_TTL_MINUTES: ${AUTH_PASSWORD_RESET_TTL_MINUTES:-30}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-propops}
      POSTGRES_USER: ${POSTGRES_USER:-propops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-propops}
    ports:
      - "5432:5432"
    volumes:
      - propops_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "test \"$(head -1 \"${PGDATA:-/var/lib/postgresql/data}/postmaster.pid\" 2>/dev/null)\" = \"1\" && pg_isready -U ${POSTGRES_USER:-propops} -d ${POSTGRES_DB:-propops}" ]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: [ "redis-server", "--appendonly", "yes" ]
    volumes:
      - propops_redis:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    <<: *node-service
    restart: "no"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-propops}:${POSTGRES_PASSWORD:-propops}@postgres:5432/${POSTGRES_DB:-propops}
      DB_SETUP_CONNECT_RETRIES: ${DB_SETUP_CONNECT_RETRIES:-30}
      DB_SETUP_CONNECT_DELAY_MS: ${DB_SETUP_CONNECT_DELAY_MS:-1000}
    command: [ "sh", "-c", "pnpm --filter @propops/api db:setup && pnpm --filter @propops/api seed:demo" ]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *node-service
    environment:
      NODE_ENV: development
      API_PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-propops}:${POSTGRES_PASSWORD:-propops}@postgres:5432/${POSTGRES_DB:-propops}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DB_SLOW_OPERATION_THRESHOLD_MS: ${DB_SLOW_OPERATION_THRESHOLD_MS:-250}
      REDIS_URL: redis://redis:6379
      CMS_DEV_USER_ID: ${CMS_DEV_USER_ID:-00000000-0000-0000-0000-000000000901}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      AUTH_PUBLIC_APP_URL: ${AUTH_PUBLIC_APP_URL:-http://localhost:3000}
      AUTH_EMAIL_FROM: ${AUTH_EMAIL_FROM:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_EMAIL_VERIFICATION_TTL_HOURS: ${AUTH_EMAIL_VERIFICATION_TTL_HOURS:-24}
      AUTH_PASSWORD_RESET_TTL_MINUTES: ${AUTH_PASSWORD_RESET_TTL_MINUTES:-30}
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://localhost:3002,http://localhost:3003
      INTERNAL_WORKER_TOKEN: ${INTERNAL_WORKER_TOKEN:-replace-with-a-long-random-worker-token}
      OBSERVABILITY_METRICS_TOKEN: ${OBSERVABILITY_METRICS_TOKEN:-replace-with-a-separate-long-random-metrics-token}
      NOTIFICATION_RUNNING_TIMEOUT_SECONDS: ${NOTIFICATION_RUNNING_TIMEOUT_SECONDS:-600}
      DEV_BILLING_WEBHOOK_SECRET: ${DEV_BILLING_WEBHOOK_SECRET:-replace-with-at-least-16-random-characters}
      SEPAY_RENTER_WEBHOOK_SECRET: ${SEPAY_RENTER_WEBHOOK_SECRET:-}
      SEPAY_RENTER_WEBHOOK_SECRET_PREVIOUS: ${SEPAY_RENTER_WEBHOOK_SECRET_PREVIOUS:-}
      PUBLIC_INVOICE_BASE_URL: ${PUBLIC_INVOICE_BASE_URL:-http://localhost:3002}
    command: [ "pnpm", "--filter", "@propops/api", "dev" ]
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 5s
      timeout: 5s
      retries: 20

  admin:
    <<: *node-service
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
      ADMIN_API_PROXY_TARGET: http://api:4000/api
      NEXT_PUBLIC_PUBLIC_INVOICE_BASE_URL: http://localhost:3002
    command: [ "pnpm", "--filter", "@propops/admin", "exec", "next", "dev", "-H", "0.0.0.0", "-p", "3000" ]
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  staff:
    <<: *node-service
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
      STAFF_API_PROXY_TARGET: http://api:4000/api
    command: [ "pnpm", "--filter", "@propops/staff", "exec", "next", "dev", "-H", "0.0.0.0", "-p", "3001" ]
    ports:
      - "3001:3001"
    depends_on:
      api:
        condition: service_healthy

  public-invoice:
    <<: *node-service
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
    command: [ "pnpm", "--filter", "@propops/public-invoice", "exec", "next", "dev", "-H", "0.0.0.0", "-p", "3002" ]
    ports:
      - "3002:3002"
    depends_on:
      api:
        condition: service_healthy

  cms:
    <<: *node-service
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api
    command: [ "pnpm", "--filter", "@propops/cms", "exec", "next", "dev", "-H", "0.0.0.0", "-p", "3003" ]
    ports:
      - "3003:3003"
    depends_on:
      api:
        condition: service_healthy

  worker-notification:
    <<: *playwright-worker-service
    environment:
      <<: *worker-environment
      WORKER_ROLE: NOTIFICATION
      WORKER_ID: docker-notification-worker
      ZALO_BASE_URL: ${ZALO_BASE_URL:-https://chat.zalo.me/}
      ZALO_HEADLESS: ${ZALO_HEADLESS:-true}
      ZALO_SESSION_PATH: /home/pwuser/.habi/zalo/session.enc
      ZALO_SESSION_KEY_BASE64: ${ZALO_SESSION_KEY_BASE64:-}
      ZALO_SESSION_LOCK_DIR: /home/pwuser/.habi/zalo/locks
      ZALO_NAVIGATION_TIMEOUT_MS: ${ZALO_NAVIGATION_TIMEOUT_MS:-30000}
      ZALO_SELECTOR_TIMEOUT_MS: ${ZALO_SELECTOR_TIMEOUT_MS:-5000}
      ZALO_VERIFICATION_TIMEOUT_MS: ${ZALO_VERIFICATION_TIMEOUT_MS:-10000}
      ZALO_LOGIN_INDICATORS: ${ZALO_LOGIN_INDICATORS:-}
      ZALO_CAPTCHA_INDICATORS: ${ZALO_CAPTCHA_INDICATORS:-}
      ZALO_SEARCH_INPUT_SELECTORS: ${ZALO_SEARCH_INPUT_SELECTORS:-}
      ZALO_MESSAGE_EDITOR_SELECTORS: ${ZALO_MESSAGE_EDITOR_SELECTORS:-}
      ZALO_SEND_BUTTON_SELECTORS: ${ZALO_SEND_BUTTON_SELECTORS:-}
    command: [ "pnpm", "--filter", "@propops/worker", "dev" ]
    volumes:
      - habi_zalo_session:/home/pwuser/.habi/zalo
    depends_on:
      api:
        condition: service_healthy

  # Separate browser process for tenant QR login; never shares browser contexts
  # or an authenticated session between tenants.
  worker-zalo-login:
    <<: *playwright-worker-service
    environment:
      <<: *worker-environment
      WORKER_ROLE: ZALO_LOGIN
      WORKER_ID: docker-zalo-login-worker
      ZALO_BASE_URL: ${ZALO_BASE_URL:-https://chat.zalo.me/}
      ZALO_HEADLESS: "true"
    command: [ "pnpm", "--filter", "@propops/worker", "dev" ]
    depends_on:
      api:
        condition: service_healthy

  worker-billing:
    <<: *node-service
    environment:
      <<: *worker-environment
      WORKER_ROLE: BILLING
      WORKER_ID: docker-billing-worker
    command: [ "pnpm", "--filter", "@propops/worker", "dev" ]
    depends_on:
      api:
        condition: service_healthy

  worker-billing-webhook:
    <<: *node-service
    environment:
      <<: *worker-environment
      WORKER_ROLE: BILLING_WEBHOOK
      WORKER_ID: docker-billing-webhook-worker
    command: [ "pnpm", "--filter", "@propops/worker", "dev" ]
    depends_on:
      api:
        condition: service_healthy

  worker-renter-payment-webhook:
    <<: *node-service
    environment:
      <<: *worker-environment
      WORKER_ROLE: RENTER_PAYMENT_WEBHOOK
      WORKER_ID: docker-renter-payment-webhook-worker
    command: [ "pnpm", "--filter", "@propops/worker", "dev" ]
    depends_on:
      api:
        condition: service_healthy

volumes:
  propops_postgres:
  propops_redis:
  habi_zalo_session:
